name: Dreams jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Распаковать, собрать
        run: |
          set -e
          # 1. MDK с GitHub
          curl -L -o mdk.zip https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle/archive/refs/heads/main.zip
          unzip -q mdk.zip
          mv MDK-1.21.1-ModDevGradle-main proj
          rm -rf proj/src/main/java/com/example/examplemod

          # 2. самый новый zip мода в репозитории (stage0-6 < stage0-7 < ...) поверх MDK
          ZIP=$(ls *.zip | grep -v '^mdk.zip$' | sort -V | tail -n1)
          echo "Беру архив: $ZIP"
          unzip -q "$ZIP" -d unpacked
          SRC=$(dirname "$(find unpacked -type d -path '*/src/main' | head -n1)")
          cp -r "$SRC"/. proj/src/

          # 3. gradle.properties: значения берём из gradle.properties.EDIT_THESE внутри архива
          PROPS=$(find unpacked -name 'gradle.properties.EDIT_THESE' | head -n1)
          grep -E '^mod_[a-z_]+=' "$PROPS" | while IFS='=' read -r k v; do
            sed -i "s|^$k=.*|$k=$v|" proj/gradle.properties
          done

          # 4. сборка
          cd proj
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dreams-jar
          path: proj/build/libs/*.jar
